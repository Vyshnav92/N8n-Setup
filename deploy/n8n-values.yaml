queueMode:
  enabled: true
  workerReplicaCount: 3

webhookProcessor:
  enabled: true
  replicaCount: 2
  disableProductionWebhooksOnMainProcess: true

hpa:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  webhookProcessor:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60


database:
  useExternal: true
  host: n8n-db-rw
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-app
    key: password

redis:
  useExternal: true
  host: redis
  port: 6379

secretRefs:
  existingSecret: n8n-secrets

webhook:
  url: "https://localhost:8443"

editor:
  url: "https://localhost:8443"

executions:
  data:
    saveOnError: "all"
    saveOnSuccess: "none"
    saveOnProgress: false
    saveManualExecutions: false
  pruning:
    enabled: true
    maxAge: 168
    maxCount: 50000

config:
  extraEnv:
    - name: N8N_PROXY_HOPS
      value: "1"
    - name: QUEUE_HEALTH_CHECK_ACTIVE
      value: "true"
    - name: N8N_DEFAULT_BINARY_DATA_MODE
      value: "database"
    - name: N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION
      value: "true"
