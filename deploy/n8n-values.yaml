queueMode:
  enabled: true
  workerReplicaCount: 3

webhookProcessor:
  enabled: true
  replicaCount: 2
  disableProductionWebhooksOnMainProcess: true

hpa:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  webhookProcessor:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60


database:
  useExternal: true
  host: n8n-db-rw
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-app
    key: password

redis:
  useExternal: true
  host: redis
  port: 6379

secretRefs:
  existingSecret: n8n-secrets

webhook:
  url: "http://localhost:8080"

config:
  extraEnv:
    - name: N8N_PROXY_HOPS
      value: "1"
    - name: N8N_EDITOR_BASE_URL
      value: "http://localhost:8080"
    - name: QUEUE_HEALTH_CHECK_ACTIVE
      value: "true"
