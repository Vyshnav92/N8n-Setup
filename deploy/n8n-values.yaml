queueMode:
  enabled: true
  workerReplicaCount: 3

# n8n workloads do not need to call the Kubernetes API
serviceAccount:
  automountServiceAccountToken: false

# Remove the chart-created Role and RoleBinding.
# n8n accesses PostgreSQL, Redis and Secrets through normal
# workload configuration, not by querying the Kubernetes API.
rbac:
  create: false

webhookProcessor:
  enabled: true
  replicaCount: 2
  disableProductionWebhooksOnMainProcess: true

hpa:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  webhookProcessor:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60


database:
  useExternal: true
  host: n8n-db-rw
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-app
    key: password

redis:
  useExternal: true
  host: redis
  port: 6379

secretRefs:
  existingSecret: n8n-secrets

webhook:
  url: "https://localhost:8443"

editor:
  url: "https://localhost:8443"

executions:
  data:
    saveOnError: "all"
    saveOnSuccess: "none"
    saveOnProgress: false
    saveManualExecutions: false
  pruning:
    enabled: true
    maxAge: 168
    maxCount: 50000

config:
  extraEnv:
    - name: N8N_PROXY_HOPS
      value: "1"
    - name: QUEUE_HEALTH_CHECK_ACTIVE
      value: "true"
    - name: N8N_DEFAULT_BINARY_DATA_MODE
      value: "database"
    - name: N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION
      value: "true"
    - name: N8N_DIAGNOSTICS_ENABLED
      value: "false"
    - name: NODES_EXCLUDE
      value: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger","n8n-nodes-base.e2eTest","n8n-nodes-base.dynamicCredentialCheck"]'
    - name: N8N_SSRF_PROTECTION_ENABLED
      value: "true"
    - name: N8N_EMAIL_MODE
      value: "smtp"
    - name: N8N_SMTP_HOST
      value: "smtp.gmail.com"
    - name: N8N_SMTP_PORT
      value: "465"
    - name: N8N_SMTP_SSL
      value: "true"
    - name: N8N_SMTP_USER
      valueFrom:
        secretKeyRef:
          name: n8n-smtp-credentials
          key: username
    - name: N8N_SMTP_PASS
      valueFrom:
        secretKeyRef:
          name: n8n-smtp-credentials
          key: password
    - name: N8N_SMTP_SENDER
      value: "vaishnavsnair39@gmail.com"
    - name: N8N_INVITE_LINKS_EMAIL_ONLY
      value: "true"

# Isolate Code node execution in external runner sidecars
taskRunners:
  enabled: true
  mode: external

  image:
    repository: n8nio/runners
    tag: "2.42.4-distroless"

  authToken:
    existingSecret: n8n-runner-token
    existingSecretKey: auth-token

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Run the task runner as the unprivileged nobody user
containerSecurityContext:
  taskRunner:
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
