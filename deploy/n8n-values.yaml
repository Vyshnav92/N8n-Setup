queueMode:
  enabled: true
  workerReplicaCount: 3

webhookProcessor:
  enabled: true
  replicaCount: 2
  disableProductionWebhooksOnMainProcess: true

hpa:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  webhookProcessor:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60


database:
  useExternal: true
  host: n8n-db-rw
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-db-app
    key: password

redis:
  useExternal: true
  host: redis
  port: 6379

secretRefs:
  existingSecret: n8n-secrets

webhook:
  url: "https://localhost:8443"

config:
  extraEnv:
    - name: N8N_PROXY_HOPS
      value: "1"
    - name: N8N_EDITOR_BASE_URL
      value: "https://localhost:8443"
    - name: QUEUE_HEALTH_CHECK_ACTIVE
      value: "true"
    - name: EXECUTIONS_DATA_SAVE_ON_ERROR
      value: "all"
    - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
      value: "none"
    - name: EXECUTIONS_DATA_SAVE_ON_PROGRESS
      value: "false"
    - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
      value: "false"
    - name: EXECUTIONS_DATA_PRUNE
      value: "true"
    - name: EXECUTIONS_DATA_MAX_AGE
      value: "168"
    - name: EXECUTIONS_DATA_PRUNE_MAX_COUNT
      value: "50000"
    - name: N8N_DEFAULT_BINARY_DATA_MODE
      value: "database"
