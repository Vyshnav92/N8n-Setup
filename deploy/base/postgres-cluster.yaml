apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: n8n
spec:
  instances: 2
  certificates:
    serverAltDNSNames:
      - n8n-db-pooler-rw
      - n8n-db-pooler-rw.n8n
      - n8n-db-pooler-rw.n8n.svc
      - n8n-db-pooler-rw.n8n.svc.cluster.local
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-wal-store
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
      log_min_duration_statement: "1000"
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
