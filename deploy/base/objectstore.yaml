apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: n8n-wal-store
  namespace: n8n
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://n8n-pitr-backup/n8n
    s3Credentials:
      accessKeyId:
        name: pg-wal-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: pg-wal-s3
        key: ACCESS_SECRET_KEY
      region:
        name: pg-wal-s3
        key: REGION
    wal:
      compression: zstd
      encryption: AES256
      maxParallel: 2
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
