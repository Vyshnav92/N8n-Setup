apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n-worker
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - n8n
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
  podMetricsEndpoints:
    - path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_container_name
          action: keep
          regex: n8n-worker
        - sourceLabels:
            - __meta_kubernetes_pod_ip
          targetLabel: __address__
          replacement: "${1}:5678"
