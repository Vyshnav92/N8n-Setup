apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n-worker
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - n8n
  selector:
    matchLabels:
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: worker
  podMetricsEndpoints:
    - targetPort: 5678
      path: /metrics
      interval: 30s
