# 1. Deny all inbound traffic in the namespace by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: n8n
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. Postgres: n8n, its own replicas, and the CNPG operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-n8n-and-operator
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: n8n-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
        - podSelector:
            matchLabels:
              cnpg.io/cluster: n8n-db
        - namespaceSelector:
            matchLabels:

              kubernetes.io/metadata.name: cnpg-system
        - podSelector:
            matchLabels:
              app: pg-backup
        - podSelector:
            matchLabels:
              app: pg-restore
      ports:
        - port: 5432
        - port: 8000
---
# 3. n8n accepts web traffic only from the in-namespace proxy and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-allow-web
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx-proxy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 5678
---
# 4. The proxy is the client-facing entry point (HTTP and HTTPS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-proxy-allow-clients
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      app: nginx-proxy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
        - port: 8443
