# PgBouncer in front of PostgreSQL. n8n connects to n8n-db-pooler-rw.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: n8n-db-pooler-rw
  namespace: n8n
spec:
  cluster:
    name: n8n-db
  instances: 1
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
