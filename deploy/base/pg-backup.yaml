apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup
  namespace: n8n
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: n8n
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: pg-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: n8n-db-app
                      key: password
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  f=/backup/n8n-$(date -u +%Y%m%dT%H%M%SZ).dump
                  pg_dump -Fc -h n8n-db-rw -U n8n -d n8n -f "$f.tmp"
                  mv "$f.tmp" "$f"
                  find /backup -name 'n8n-*.dump' -mtime +7 -delete
                  ls -lh /backup
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: pg-backup
