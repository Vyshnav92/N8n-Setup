apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Vyshnav92/N8n-Setup.git
    targetRevision: main
    path: deploy/barman-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
