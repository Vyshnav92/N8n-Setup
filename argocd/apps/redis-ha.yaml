apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis-cluster
    targetRevision: 13.0.4
    helm:
      releaseName: redis-ha
      valuesObject:
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/redis-cluster
          tag: 8.2.1-debian-12-r0
        usePassword: true
        existingSecret: redis-cluster-auth
        existingSecretPasswordKey: redis-password
        cluster:
          nodes: 6
          replicas: 1
        persistence:
          enabled: true
          size: 1Gi
        networkPolicy:
          enabled: false
        extraDeploy:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: redis-ha-redis-cluster
              namespace: redis-ha
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: redis-ha
                  app.kubernetes.io/name: redis-cluster
              policyTypes:
                - Ingress
              ingress:
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: n8n
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: n8n
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: keda
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: keda-operator
                  ports:
                    - port: 6379
                      protocol: TCP
                - from:
                    - podSelector:
                        matchLabels:
                          app.kubernetes.io/instance: redis-ha
                          app.kubernetes.io/name: redis-cluster
                  ports:
                    - port: 6379
                      protocol: TCP
                    - port: 16379
                      protocol: TCP
        resourcesPreset: nano
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-ha
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
