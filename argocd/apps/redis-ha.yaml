apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-ha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis-cluster
    targetRevision: 13.0.4
    helm:
      releaseName: redis-ha
      valuesObject:
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/redis-cluster
          tag: 8.2.1-debian-12-r0
        usePassword: true
        existingSecret: redis-cluster-auth
        existingSecretPasswordKey: redis-password
        cluster:
          nodes: 6
          replicas: 1
        persistence:
          enabled: true
          size: 1Gi
        resourcesPreset: nano
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-ha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
