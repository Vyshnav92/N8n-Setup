name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Lint YAML files, including the workflow itself
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint YAML
        run: |
          python -m pip install yamllint
          yamllint -d relaxed \
            .github/workflows deploy/base argocd bootstrap \
            deploy/n8n-values.yaml

      # 2. Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      # 3. Install kubeconform
      - name: Install kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      # 4. Validate plain Kubernetes manifests
      - name: Validate plain manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary -recursive \
            deploy/base argocd bootstrap

      # 5. Lint the n8n Helm chart and its values
      - name: Lint n8n Helm chart
        run: |
          helm lint \
            oci://ghcr.io/n8n-io/n8n-helm-chart/n8n \
            --version 1.15.0 \
            -f deploy/n8n-values.yaml

      # 6. Render the chart
      - name: Render n8n chart
        run: |
          helm template n8n \
            oci://ghcr.io/n8n-io/n8n-helm-chart/n8n \
            --version 1.15.0 \
            -n n8n \
            -f deploy/n8n-values.yaml \
            > rendered.yaml

      # 7. Validate the rendered Kubernetes resources
      - name: Validate rendered chart
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            rendered.yaml

      # 8. Scan configuration for security misconfigurations
      - name: Scan configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
