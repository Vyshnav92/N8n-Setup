apiVersion: batch/v1
kind: Job
metadata:
  name: pg-verify-s3
  namespace: n8n
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
      initContainers:
        - name: fetch
          image: rclone/rclone:1.68.2
          envFrom:
            - secretRef:
                name: s3-backup
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "--- 5 newest dumps in the bucket (size, date, name)"
              rclone lsl s3:n8n-backup-v1/n8n-postgres --include 'n8n-*.dump' | sort -k4 | tail -n 5
              NEWEST=$(rclone lsf s3:n8n-backup-v1/n8n-postgres --files-only --include 'n8n-*.dump' | sort | tail -n 1)
              [ -n "$NEWEST" ] || { echo "No dump found in S3"; exit 1; }
              echo "--- downloading $NEWEST"
              rclone copyto "s3:n8n-backup-v1/n8n-postgres/$NEWEST" /work/dump
              echo "$NEWEST" > /work/name
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              echo "File: $(cat /work/name)"; ls -lh /work/dump
              [ -s /work/dump ] || { echo "FAIL: file is empty"; exit 1; }
              pg_restore --list /work/dump > /tmp/toc.txt || { echo "FAIL: dump is unreadable or truncated"; exit 1; }
              echo "--- dump header"; head -n 14 /tmp/toc.txt
              echo "--- entries in dump: $(wc -l < /tmp/toc.txt)"
              for t in workflow_entity credentials_entity migrations; do
                grep -q "TABLE DATA public $t " /tmp/toc.txt && echo "found data for: $t" || { echo "FAIL: no data section for $t"; exit 1; }
              done
              echo "RESULT: dump is readable and contains the core n8n tables"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
