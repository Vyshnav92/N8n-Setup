apiVersion: batch/v1
kind: Job
metadata:
  generateName: pg-restore-
  namespace: n8n
  labels:
    app.kubernetes.io/name: pg-restore
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pg-restore
        app.kubernetes.io/name: pg-restore
    spec:
      restartPolicy: Never
      serviceAccountName: pg-restore
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch
          image: rclone/rclone:1.68.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu

              remote="s3:n8n-backup-v1/n8n-postgres"

              listing="$(rclone lsf "$remote" --files-only)"

              latest="$(printf '%s\n' "$listing" |
                grep -E '^n8n-[0-9]{8}T[0-9]{6}Z\.dump$' |
                sort | tail -n 1 || true)"

              if [ -z "$latest" ]; then
                echo "ERROR: No completed backup found in S3" >&2
                exit 1
              fi

              echo "Latest S3 backup selected: $latest"

              rclone copyto "$remote/$latest" \
                /work/restore.dump --log-level INFO

          envFrom:
            - secretRef:
                name: s3-backup
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: restore
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          env:
            - { name: PGHOST, value: n8n-db-rw }
            - { name: PGUSER, value: n8n }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: n8n-db-app, key: password }
            - { name: TARGET_DB, value: "__TARGET_DB__" }
            - { name: ALLOW_OVERWRITE, value: "__ALLOW_OVERWRITE__" }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              f=/work/restore.dump
              size=$(stat -c %s "$f"); echo "Dump size: $size bytes"
              [ "$size" -gt 10240 ] || { echo "ERROR: dump is suspiciously small"; exit 1; }
              pg_restore --list "$f" > /tmp/toc.txt
              grep -q 'TABLE DATA public workflow_entity' /tmp/toc.txt || { echo "ERROR: no workflow data in archive"; exit 1; }
              echo "Archive OK: $(wc -l < /tmp/toc.txt) entries"
              existing=$(psql -d "$TARGET_DB" -Atc "select count(*) from public.workflow_entity" 2>/dev/null || echo 0)
              echo "Workflows already in $TARGET_DB: $existing"
              if [ "$existing" -gt 0 ] && [ "$ALLOW_OVERWRITE" != "true" ]; then
                echo "REFUSING: target already has data. Re-run with ALLOW_OVERWRITE=true"; exit 1
              fi
              echo "Restoring into $TARGET_DB ..."
              pg_restore --clean --if-exists --no-owner --no-privileges --single-transaction --exit-on-error -d "$TARGET_DB" "$f"
              psql -d "$TARGET_DB" -Atc "select 'workflows='||count(*) from public.workflow_entity" || true
              psql -d "$TARGET_DB" -Atc "select 'credentials='||count(*) from public.credentials_entity" || true
              echo "RESTORE COMPLETE"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: work, mountPath: /work, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
